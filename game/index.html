<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101b22">
  <title>Drop Zone Squad</title>
  <link rel="preload" as="image" href="art/hub/operations.webp" media="(orientation: portrait)" fetchpriority="high">
  <link rel="preload" as="image" href="art/hub/operations-wide.webp" media="(orientation: landscape)" fetchpriority="high">
  <link rel="stylesheet" href="type.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="arcade.css">
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="encounter.css">
  <link rel="stylesheet" href="preparation.css">
  <link rel="stylesheet" href="field-ui.css">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="lobby-pages.css">
  <link rel="stylesheet" href="talent-screen.css">
  <link rel="stylesheet" href="rank-test.css">
  <link rel="stylesheet" href="squad-interface.css">
</head>
<body>
  <section id="loading-screen" aria-labelledby="loading-title">
    <picture>
      <source media="(orientation: landscape)" srcset="art/hub/operations-wide.webp">
      <img id="loading-art" src="art/hub/operations.webp" alt="" fetchpriority="high" width="1024" height="1536">
    </picture>
    <div class="loading-panel">
      <h1 id="loading-title">DROP ZONE<br><span>SQUAD</span><i aria-hidden="true"></i></h1>
      <p id="loading-status" role="status">게임 불러오는 중</p>
      <progress id="loading-progress" aria-labelledby="loading-status"></progress>
      <button type="button" id="loading-retry" hidden>다시 불러오기</button>
    </div>
  </section>
  <details id="rank-test" hidden><summary aria-label="대원 테스트" title="대원 테스트"><span>대원 테스트</span></summary><div class="rank-options">
    <label>조작 대원<select id="test-crew"></select></label>
    <label>테스트 등급<select id="test-rank"><option value="">대원 등급</option></select></label>
    <output id="test-current"></output>
    <button type="button" id="test-special" hidden>특수스킬 발동</button></div></details>
  <canvas id="world" aria-label="을지로 전투 지역"></canvas>
  <main id="home" class="overlay" hidden>
    <div id="lobby-hub">
      <div id="lobby-pages">
    <section id="barracks-page" aria-label="생활관" hidden>
    <p class="promotion-notice" id="promotion-notice" role="status"></p>
    <section id="prep-screen" aria-labelledby="prep-title" hidden>
      <div class="prep-shell">
        <header class="prep-head"><button id="prep-back" data-field-control="secondary" type="button" aria-label="메인 메뉴로 돌아가기">뒤로</button><h2 id="prep-title">생활관</h2>
          <div class="prep-nav"><button type="button" id="change-crew" data-field-control="secondary">크루 변경</button><button type="button" id="prep-save" data-field-control="primary">저장</button></div>
        </header>
        <div class="dressing"><div class="slot-column" id="slots-left"></div>
          <div class="formation"><div class="promotion-panel" id="prep-promotion"></div><div id="crew-figures" role="group" aria-label="장비를 편집할 대원"></div>
            <div class="crew-caption"><h3 id="crew-name"></h3><button type="button" id="make-leader" data-field-control="secondary">선두 지정</button></div>
          </div><div class="slot-column" id="slots-right"></div></div>
        <section class="locker" aria-label="공용 장비 보관함">
          <div class="locker-head"><h3 id="locker-title"></h3><span id="locker-owner"></span><div class="locker-filters">
            <label>랭크 <select id="gear-rank" data-field-control="secondary" aria-label="랭크 필터"><option value="">전체</option><option>S+</option><option>S</option><option>A</option><option>B</option><option>C</option></select></label>
            <label>정렬 <select id="gear-sort" data-field-control="secondary" aria-label="정렬 우선순위"><option value="ascending">낮은 랭크순</option><option value="rank">높은 랭크순</option><option value="power">성능 우선</option><option value="name">이름순</option></select></label>
          </div></div>
          <div id="gear-inventory" role="group" aria-label="대원 장비 목록"></div>
          <section id="gear-detail" aria-labelledby="item-title" hidden>
            <div class="gear-art"><img id="item-icon" alt=""></div>
            <div class="gear-info" aria-live="polite" aria-atomic="true">
              <div class="gear-meta"><em id="item-tier" class="tier"></em><span id="item-context"></span></div>
              <h4 id="item-title"></h4><p id="item-detail"></p><p id="item-magazine"></p><small id="item-compare"></small>
            </div>
            <button type="button" id="item-close" data-field-control="secondary" aria-label="장비 상세 닫기">×</button>
            <div id="enhancement" hidden>
              <label>강화 단계 <select id="item-level" data-field-control="secondary"></select></label><span id="fusion-preview"></span>
              <button type="button" id="item-fuse" data-field-control="secondary"></button>
            </div>
            <button type="button" id="item-action" data-field-control="primary"></button>
          </section>
        </section>
      </div>
    </section>
    <section id="roster-screen" aria-labelledby="roster-title" hidden>
      <div class="roster-content">
        <header class="roster-header">
          <button type="button" id="roster-back" data-field-control="secondary" aria-label="생활관으로 돌아가기">뒤로</button>
          <h2 id="roster-title">출발 크루 편성</h2>
          <div class="roster-count" aria-live="polite">편성 <strong id="roster-count">0 / 3</strong></div>
        </header>
        <p id="roster-help">세 명을 선택하세요. 첫 번째 대원이 선두에 섭니다.</p>
        <div id="operator-grid" role="group" aria-label="출전 대원" aria-describedby="roster-help"></div>
        <footer class="roster-footer">
          <p id="squad-line" aria-live="polite"></p>
          <div>
            <button type="button" id="save-team" data-field-control="primary" class="secondary" disabled>편성 적용</button>
          </div>
        </footer>
      </div>
    </section>
    </section>
    <section id="main-menu" aria-labelledby="game-title">
      <header class="home-mast">
        <div class="title-block"><div class="location"><i class="map-pin" aria-hidden="true"></i>서울<span class="divider"></span><span id="mission-location">을지로3가</span></div>
          <h1 id="game-title">DROP ZONE<br><span>SQUAD</span><i aria-hidden="true"></i></h1></div>
        <div class="wallet" aria-label="보유 다이아"><i class="gem" aria-hidden="true"></i><span data-balance>0</span></div>
      </header>
      <section class="mission-selector" aria-label="출격 스테이지">
        <figure id="stage-preview">
          <img id="stage-preview-art" src="art/stages/stage-1.webp" alt="">
          <figcaption><h2 id="stage-preview-name">을지로 봉쇄선</h2><span id="stage-brief"></span></figcaption>
        </figure>
        <div class="stage-switch" role="group" aria-label="스테이지 선택">
          <button id="stage-prev" data-field-control="secondary" type="button" aria-label="이전 스테이지" disabled><i aria-hidden="true"></i></button>
          <output id="stage-label" tabindex="0" aria-live="polite" aria-atomic="true">스테이지 1</output>
          <button id="stage-next" data-field-control="secondary" type="button" aria-label="다음 스테이지"><i aria-hidden="true"></i></button>
        </div>
      </section>
      <div class="lobby-controls">
        <nav aria-label="메인 메뉴">
          <button id="start" data-field-control="primary" class="menu-start" type="button" disabled>불러오는 중</button>
        </nav>
        <div class="controlhint">
          <div class="hint-touch"><span>화면을 드래그해 이동</span><i></i><span id="combat-input-hint">대원이나 스킬 버튼을 밀어 사용</span></div>
        </div>
      </div>
    </section>
    <section id="talent-page" aria-label="분대 스킬트리" hidden></section>
    <section id="shop-page" class="supply-shop" aria-labelledby="crate-title" hidden>
    <header class="shop-head">
      <h2 id="crate-title">보급 상점</h2>
      <div class="shop-head-actions"><div class="wallet" aria-label="보유 다이아"><i class="gem" aria-hidden="true"></i><span data-balance>0</span></div></div>
    </header>
    <div class="shop-body">
      <div id="supply-list"></div>
      <template id="supply-template">
        <section class="supply-card">
          <button data-rates type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="supply-rates-dialog"><span aria-hidden="true">!</span></button>
          <div class="supply-top">
            <div class="supply-art"><img data-crate-art alt=""></div>
            <div class="supply-identity">
              <h3 data-crate-name></h3>
              <div class="level-row"><strong data-level></strong><span data-level-steps></span></div>
              <div class="level-meter" aria-hidden="true"><i></i></div>
            </div>
          </div>
          <div class="supply-actions">
            <div class="supply-guarantee"><span data-guarantee></span></div>
            <button class="draw-supply" data-draw type="button"><span>1회 개봉</span><strong><i class="gem" aria-hidden="true"></i><span data-price></span></strong></button>
          </div>
          <div class="supply-drop" data-drop role="status"></div>
        </section>
      </template>
      <section class="diamond-section" aria-labelledby="diamond-title">
        <div class="diamond-heading"><h3 id="diamond-title">다이아 구매</h3><span id="diamond-mode"></span></div>
        <div class="diamond-grid" id="diamond-packs"></div>
        <div id="diamond-result" role="status"></div>
      </section>
      <button type="button" id="profile-mode" aria-pressed="false"></button>
    </div>
    <dialog id="supply-rates-dialog" aria-labelledby="rates-title" aria-describedby="rates-status rates-guarantee">
      <header class="rates-head">
        <div><h3 id="rates-title"></h3><p id="rates-status"></p></div>
        <button type="button" id="rates-close" aria-label="확률표 닫기">×</button>
      </header>
      <p id="rates-guarantee"></p>
      <div id="rates-scroll" tabindex="0" role="region" aria-label="레벨별 일반 개봉 확률표">
        <table class="shop-rate-table" aria-label="보급상자 레벨별 일반 개봉 확률">
          <thead><tr><th scope="col">레벨</th><th scope="col">누적 개봉</th><th scope="col" class="grade-C">C</th><th scope="col" class="grade-B">B</th><th scope="col" class="grade-A">A</th><th scope="col" class="grade-S">S</th></tr></thead>
          <tbody id="rates-table-body"></tbody>
        </table>
      </div>
      <footer class="rates-foot"><button type="button" id="rates-done">닫기</button></footer>
    </dialog>
    <dialog class="diamond-confirm" id="diamond-confirm" aria-labelledby="purchase-title">
      <form method="dialog"><h3 id="purchase-title"></h3><p id="purchase-description"></p>
        <div><button type="submit" value="cancel" autofocus>취소</button><button type="button" id="confirm-diamonds"></button></div>
      </form>
    </dialog>
  </section>
      </div>
      <nav id="hub-nav" aria-label="기지 페이지">
        <button type="button" id="select-team" data-page="barracks" aria-controls="barracks-page" disabled><img class="hub-icon" src="art/hub/nav-barracks.webp" alt="">생활관</button>
        <button type="button" id="hub-home" data-page="operations" aria-controls="main-menu" aria-current="page"><img class="hub-icon" src="art/hub/nav-operations.webp" alt="">작전</button>
        <button type="button" id="hub-talents" data-page="talents" aria-controls="talent-page"><img class="hub-icon" src="art/hub/nav-talents.webp" alt="">스킬트리</button>
        <button type="button" id="shop" data-page="shop" aria-controls="shop-page" disabled><img class="hub-icon" src="art/hub/nav-shop.webp" alt="">상점</button>
      </nav>
    </div>

  </main>

  <section id="hud" aria-label="전투 상태" hidden>
    <div class="top">
      <button id="pause" data-field-control="secondary" aria-label="일시 정지"><i aria-hidden="true"></i></button>
      <div class="timer" aria-label="작전 경과 시간"><b id="time"></b></div>
      <span id="kills"></span>
    </div>
    <div id="sector"></div>
    <div id="stage-panel" aria-label="스테이지 진행">
      <div class="stage-line"><strong id="stage-number"></strong><span id="stage-name"></span></div>
      <div class="stage-line"><span id="wave-label" aria-live="polite"></span><b id="wave-countdown" aria-label="웨이브 남은 시간"></b></div>
      <div id="boss-status" hidden><div><span id="boss-name"></span><b id="boss-percent"></b></div><progress id="boss-health" max="100" value="100" aria-label="보스 체력"></progress></div>
    </div>
    <aside id="encounter-alert" role="status" hidden><span></span><strong></strong></aside>
    <div class="xp" aria-label="분대 레벨과 경험치"><em id="lv"></em><div><i id="xpfill"></i></div></div>
    <span id="ammo-status" aria-label="선두 대원 탄약"></span>
    <div id="party" role="group" aria-label="분대원 선택"></div>
    <button id="cast" data-field-control="secondary" type="button"><span id="cast-name"></span><small id="cast-status"></small></button>
  </section>

  <section id="upgrade" class="overlay sheet" aria-labelledby="augment-title" aria-describedby="levelcaption" hidden>
    <header><div><small id="levelcaption"></small><h2 id="augment-title">전투 증강 선택</h2></div><button type="button" id="upgrade-home" data-field-control="secondary">저장 후 나가기</button></header>
    <div id="cards" role="group" aria-label="증강 후보"></div>
    <footer><span id="buildstat"></span><button id="talent-reroll" type="button" data-field-control="secondary" hidden>증강 리롤 1회</button><button id="equip" data-field-control="primary" class="action">증강 적용</button></footer>
  </section>

  <section id="dialog" class="overlay dialog" aria-labelledby="dialogtitle" hidden>
    <div class="report">
      <header><h2 id="dialogtitle"></h2><p id="summary"></p></header>
      <div id="loadout" aria-label="분대 장비"></div>
      <footer><button id="resume" data-field-control="primary" class="action"></button><button id="homebtn" data-field-control="secondary" class="secondary">타이틀로</button></footer>
    </div>
  </section>
  <dialog id="replace-run" class="armory-popup" aria-labelledby="replace-title" aria-describedby="saved-sortie">
    <h2 id="replace-title">진행 중인 작전</h2>
    <p id="saved-sortie"></p>
    <div class="popup-buttons">
      <button type="button" id="continue-run" data-field-control="primary" autofocus>이어하기</button>
      <button type="button" id="ask-replace" data-field-control="secondary">새 작전</button>
      <button type="button" id="replace-confirm" data-field-control="primary" hidden>새 작전 시작</button>
      <button type="button" id="replace-cancel" data-field-control="secondary">닫기</button>
    </div>
  </dialog>
  <script src="images.js"></script>
  <script src="streets.js"></script>
  <script src="street-wear.js"></script>
  <script src="city-damage.js"></script>
  <script src="city-kit.js"></script>
  <script src="transit-kit.js"></script>
  <script src="street-fixture-frames.js"></script>
  <script src="street-fixtures.js"></script>
  <script src="seoul-architecture.js"></script>
  <script src="seoul.js"></script>
  <script src="surface.js"></script>

  <script src="gwanghwamun.js"></script>
  <script src="seoul-layouts.js"></script>
  <script src="district-maps.js"></script>
  <script src="water.js"></script>
  <script src="battlefield.js"></script>
  <script src="metro.js"></script>
  <script src="station-links.js"></script>
  <script src="navigation.js"></script>
  <script src="ambience.js"></script>
  <script src="art/tag-combat/sfx-bank.js"></script>
  <script src="art/skills/sounds.js"></script>
  <script src="combat.js"></script>
  <script src="squad-skills.js"></script>
  <script src="stages.js"></script>
  <script src="bosses.js"></script>
  <script src="stage-hud.js"></script>
  <script src="cct.js"></script>
  <script src="supply-rules.js"></script>
  <script src="talent-tree.js"></script>
  <script src="equipment.js"></script>
  <script src="diamond-store.js"></script>
  <script src="game.js"></script>
  <script src="lobby.js"></script>
  <script src="shop.js"></script>
  <script src="talent-screen.js"></script>
  <script src="lobby-pages.js"></script>
  <script src="checkpoint.js"></script>
  <script src="art/tag-combat/atlas.js"></script>
  <script src="art/armory/weapon-sockets.js"></script>
  <script src="skill-art.js"></script>
  <script src="awakened-art.js"></script>
  <script src="crew-outfits.js"></script>
  <script src="art/armory/raven-cels/grips.js"></script>
  <script src="raven-cels.js"></script>
  <script src="bulk-shield.js"></script>
  <script src="rank-field.js"></script>
  <script src="art/armory/crew-frames/anchors.js"></script>
  <script src="recruit-cels.js"></script>
  <script src="rank-test.js"></script>
  <script src="render.js"></script>
</body>
</html>
